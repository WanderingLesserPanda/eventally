# Eventally — self-hosted household ledger.
#
# The app image is prebuilt by GitHub Actions on every push to main
# (ghcr.io/wanderinglesserpanda/eventally:latest). On a host that can
# reach ghcr.io (TrueNAS "Install via YAML", any docker host):
#   1. docker login ghcr.io   (your GitHub account + a PAT with read
#                              packages scope — see docs/notes/cutover.md)
#   2. copy the compose snippet you need, fill in the two secrets
#
# POSTGRES_PASSWORD: 8-64 characters; special characters ! @ # $ % ^ & *
# + - are all supported (the app connects via structured variables, not a
# URL DSN). Generate one with specials, e.g.:
#   tr -dc 'a-z!@#$%^&*+-' </dev/urandom | head -c 20; echo
# (any 8-64 char string works; the app validates the length at startup.)
# On a machine with a Go toolchain you can instead `docker build .`.
#
# First visit: http://<host>:8090  -> the first-run setup page creates
# the household and the first user.
#
# NOTE: EVENTALLY_SECRET must be exactly 64 hex chars (openssl rand -hex 32).
# Reserved for the future authentik/OIDC layer (not yet consumed); the app
# refuses to start without it.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eventally
    volumes:
      # "data": Postgres database files (all ledger data).
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventally -d eventally"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/wanderinglesserpanda/eventally:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      EVENTALLY_ADDR: ":8090"
      # Structured Postgres connection (not a URL DSN) so the password may
      # contain special characters (!@#$%^&*+- ...). 8-64 chars, validated
      # at app startup.
      EVENTALLY_PG_HOST: "db"
      EVENTALLY_PG_PORT: "5432"
      EVENTALLY_PG_DATABASE: "eventally"
      EVENTALLY_PG_USER: "eventally"
      EVENTALLY_PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (8-64 chars, specials ok)}
      EVENTALLY_SECRET: ${EVENTALLY_SECRET:?set EVENTALLY_SECRET (64 hex) in .env}
      EVENTALLY_DATA_DIR: "/data"
    volumes:
      # "media": uploaded receipts and other user files (the app's data dir).
      - media:/data
    ports:
      - "8090:8090"

volumes:
  data:
  media:
